<!DOCTYPE html>
<html lang="en">

<head>
    <title>Sign In - Sleep AI</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="apple-touch-icon" href="../static/assets/img/apple-icon.png">
    <link rel="shortcut icon" type="image/x-icon" href="../static/assets/img/favicon.ico">
    <!-- Load Require CSS -->
    <link href="../static/assets/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font CSS -->
    <link href="../static/assets/css/boxicon.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Load Tempalte CSS -->
    <link rel="stylesheet" href="../static/assets/css/templatemo.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../static/assets/css/custom.css">
    <style>
        body {
            padding-top: 80px; 
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.8s ease-in-out;
        }
    </style>
</head>

<body>


    <!-- Main Content -->
    <section class="container py-5 fade-in">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card shadow-lg border-0 rounded-lg">
                    <div class="card-body p-0">
                        <div class="row">
                            <div class="col-lg-6 p-5">
                                <div class="text-center">
                                    <h1 class="h2 text-dark mb-4">Welcome Back!</h1>
                                </div>
                                <!-- Error Message -->
                                {% if message %}
                                <div id="errorMessage" class="alert alert-danger" role="alert">
                                    {{ message }}
                                </div>
                                {% endif %}
                                <form action="/signin" method="POST">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" id="floatingInput" placeholder="Username" name="user">
                                        <label for="floatingInput">Username</label>
                                    </div>
                                    <div class="form-floating mb-4">
                                        <input type="password" class="form-control" id="floatingPassword" placeholder="Password" name="password">
                                        <label for="floatingPassword">Password</label>
                                    </div>
                                    <div class="d-flex justify-content-between align-items-center mb-4">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" value="" id="form-check-remember">
                                            <label class="form-check-label" for="form-check-remember">
                                                Remember Me
                                            </label>
                                        </div>
                                    </div>
                                    <div class="d-grid">
                                        <button class="btn btn-primary btn-lg rounded-pill" type="submit">Sign In</button>
                                    </div>
                                </form>
                                <hr>
                                <div class="text-center">
                                    <a class="small" href="/logon">Need an account? Sign Up!</a>
                                </div>
                            </div>
                            <div class="col-lg-6 d-none d-lg-flex align-items-center justify-content-center bg-primary rounded-end">
                                <img src="../static/assets/img/work.svg" class="img-fluid p-5" alt="AI Illustration">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- End Main Content -->



    <!-- Bootstrap -->
    <script src="../static/assets/js/bootstrap.bundle.min.js"></script>
</body>

</html>
