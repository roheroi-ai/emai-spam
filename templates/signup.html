<!DOCTYPE html>
<html lang="en">

<head>
    <title>Sign Up - Sleep AI</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="apple-touch-icon" href="../static/assets/img/apple-icon.png">
    <link rel="shortcut icon" type="image/x-icon" href="../static/assets/img/favicon.ico">
    <!-- Load Require CSS -->
    <link href="../static/assets/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font CSS -->
    <link href="../static/assets/css/boxicon.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Load Tempalte CSS -->
    <link rel="stylesheet" href="../static/assets/css/templatemo.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../static/assets/css/custom.css">
    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.8s ease-in-out;
        }
    </style>
</head>

<body>
    <!-- Main Content -->
    <section class="container py-5 fade-in">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card shadow-lg border-0 rounded-lg">
                    <div class="card-body p-0">
                        <div class="row">
                            <div class="col-lg-6 d-none d-lg-flex align-items-center justify-content-center bg-primary rounded-start">
                                <img src="../static/assets/img/pricing.svg" class="img-fluid p-5" alt="AI Illustration">
                            </div>
                            <div class="col-lg-6 p-5">
                                <div class="text-center">
                                    <h1 class="h2 text-dark mb-4">Create Your Account</h1>
                                </div>
                                <!-- Error Message -->
                                {% if message %}
                                <div id="errorMessage" class="alert alert-danger" role="alert">
                                    {{ message }}
                                </div>
                                {% endif %}
                                <form action="/signup" method="POST">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" id="floatingUsername" name="user" placeholder="Username">
                                        <label for="floatingUsername">Username</label>
                                    </div>
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" id="floatingName" name="name" placeholder="Full Name">
                                        <label for="floatingName">Full Name</label>
                                    </div>
                                    <div class="form-floating mb-3">
                                        <input type="email" class="form-control" id="floatingInput" name="email" placeholder="name@example.com">
                                        <label for="floatingInput">Email address</label>
                                    </div>
                                    <div class="form-floating mb-3">
                                        <input type="tel" class="form-control" id="floatingNumber" name="mobile" placeholder="Number">
                                        <label for="floatingNumber">Number</label>
                                    </div>
                                    <div class="form-floating mb-4">
                                        <input type="password" class="form-control" id="floatingPassword" name="password" placeholder="Password">
                                        <label for="floatingPassword">Password</label>
                                    </div>
                                    <div class="d-grid">
                                        <button class="btn btn-primary btn-lg rounded-pill" type="submit">Sign Up</button>
                                    </div>
                                </form>
                                <hr>
                                <div class="text-center">
                                    <a class="small" href="/login">Already have an account? Sign In!</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- End Main Content -->

    <!-- Bootstrap -->
    <script src="../static/assets/js/bootstrap.bundle.min.js"></script>
</body>

</html>
